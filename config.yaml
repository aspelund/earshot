audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30
  source: "mic"  # "mic" for local microphone, "network" for streaming

network:
  enabled: false
  host: "0.0.0.0"  # Listen on all interfaces
  port: 8765
  auth_token: null  # Optional authentication token

vad:
  threshold: 0.35 # Lower = more sensitive (catch speech earlier)
  ema_alpha: 0.25 # Lower = smoother, less reactive to spikes
  pre_ms: 600 # Extra pre-padding to capture initial sounds
  hang_ms: 700 # Wait 700ms of silence before cutting
  post_ms: 400 # Generous post-padding (note: now captures all hangover frames)
  max_segment_s: 30 # Allow longer segments
  model_path: "./models/ten_vad.onnx"

stt:
  model_size: "medium"     # Multilingual, high accuracy
  device: "cuda"           # "cuda" for GPU, "cpu" for CPU
  compute_type: "float16"  # "float16" for GPU, "int8" for CPU
  language: null           # Auto-detect language (or set to "en", "sv", etc.)
  beam_size: 1             # Greedy decoding for speed
  word_timestamps: true

logging:
  dir: "~/stt_logs"
  file: "asr.jsonl"
  rotate_mb: 10
  backups: 5
  heartbeat_s: 60
