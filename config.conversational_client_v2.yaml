# Configuration for v2 conversational client with robust cancellation
# Uses servers for: Whisper (transcription), LLM, TTS
# Local: VAD, audio playback

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30

vad:
  threshold: 0.35
  ema_alpha: 0.25
  pre_ms: 1200          # Increased for better speech start capture
  hang_ms: 1200
  post_ms: 400
  max_segment_s: 30
  min_speech_ms: 700
  model_path: "./models/ten_vad.onnx"

# Whisper server for transcription
whisper_server:
  url: "ws://localhost:8765"
  auth_token: null
  language: "en"

# LLM server (OpenAI-compatible API)
llm:
  host: "100.120.226.89"  # WSL2 gateway IP to reach Windows host
  port: 1234
  model: "qwen3-vl-8b-instruct"
  temperature: 0.7
  max_tokens: -1
  system_prompt: "You are a helpful voice assistant. Keep it short, especially the first sentence. Anything you say will be read out using text-to-speech technology, so keep it short and simple, and avoid lists, markdown, smileys, emojis. Respond in a natural, conversational tone suitable for spoken dialogue. NEVER USE MARKDOWN. NEVER USE EMOJIS. ALWAYS RESPOND IN ENGLISH ONLY - the TTS system only supports English."

# TTS WebSocket server
tts:
  url: "ws://localhost:8766"
  auth_token: null
  recv_timeout_ms: 100  # Timeout for recv() to allow cancellation checks

# Audio playback (local)
playback:
  fade_out_duration_ms: 250
  output_device: null   # null = default device

# Conversation settings
conversation:
  max_history: 10
  interrupt_timeout_s: 0.5
