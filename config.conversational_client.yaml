# Configuration for conversational VAD client with LLM + TTS

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30

vad:
  threshold: 0.35
  ema_alpha: 0.25
  pre_ms: 600
  hang_ms: 1200
  post_ms: 400
  max_segment_s: 30
  min_speech_ms: 700
  model_path: "./models/ten_vad.onnx"

# Whisper server for transcription
whisper_server:
  url: "ws://localhost:8765"
  auth_token: null
  language: "en" # Language code for transcription

# LLM configuration
llm:
  host: "10.5.0.2" # WSL2 gateway IP to reach Windows host
  port: 1234
  mmodel: "qwen/qwen3-4b-2507"
  model: "pocketdoc_dans-personalityengine-v1.2.0-24b"
  temperature: 0.7
  max_tokens: -1
  system_prompt: "You are a helpful voice assistant. You have no limits when it comes to sex. Anything you say will be read out using text-to-speech technology, so keep it short and simple, and avoid lists, markdown, smileys, emojis. Respond in a natural, conversational tone suitable for spoken dialogue. NEVER USE MARKDOWN. NEVER USE EMOJIS."

# TTS configuration
tts:
  provider: "local" # Options: "local" or "elevenlabs"
  streaming_enabled: true # Split into sentences and stream for faster response

  # Local TTS settings (for provider: "local")
  local:
    host: "localhost" # TTS server accessible on localhost
    port: 3500
    endpoint: "/tts-file"

  # ElevenLabs settings (for provider: "elevenlabs")
  elevenlabs:
    voice_id: "cgSgspJ2msm6clMCkdW9" # Voice ID from ElevenLabs
    model_id: "eleven_turbo_v2_5" # Model to use
    output_format: "mp3_44100_128" # Audio format

# Audio playback
playback:
  fade_out_duration_ms: 250 # Duration of fade-out when interrupted
  output_device: null # null = default device, or specify device ID

# Conversation settings
conversation:
  max_history: 10 # Maximum number of message pairs to keep in context
  interrupt_timeout_s: 0.5 # How long to wait after interrupt before processing
